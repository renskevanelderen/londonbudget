name: Deploy naar GitHub Pages

# Elke push naar main zet de app opnieuw online. Belangrijk: index.html wordt
# hier opnieuw gebouwd uit de .part-bestanden. Zou ik het bestand uit de repo
# rechtstreeks publiceren, dan kan een vergeten "python3 tools/bouw.py" een
# oude versie online zetten zonder dat iemand het merkt.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Twee deploys tegelijk gaan elkaar in de weg zitten; de laatste push wint.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: index.html samenstellen
        run: python3 tools/bouw.py

      - uses: actions/configure-pages@v5

      # Alleen de app-map gaat online. De .part-bestanden gaan mee - dat is
      # geen probleem, ze staan toch al open op GitHub, en zo kan iemand zien
      # hoe het gemaakt is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
